<script>
function checkGlobalCityData() {
  try {
    const rawData = localStorage.getItem('elvenar_shared_dashboard');
    if(rawData) {
      const data = JSON.parse(rawData);
      let banner = document.getElementById('syncBanner');
      if(!banner) {
        banner = document.createElement('div');
        banner.id = 'syncBanner';
        banner.style.cssText = "background:#0f3460; border:1px solid #3498db; padding:8px; margin:10px auto; border-radius:4px; font-size:11px; color:#8f8; text-align:center; max-width:800px;";
        document.body.insertBefore(banner, document.body.firstChild);
      }
      banner.innerHTML = `📡 <b>Cité connectée :</b> ${data.unlockedSpaces} cases débloquées au total | <b>${data.freeSpaces} espaces libres</b> (Mise à jour à ${data.lastUpdate})`;
    }
  } catch(e) {
    console.log("Erreur lecture synchro :", e);
  }
}

// Vérifie les données transmises par le planificateur dès l'ouverture
window.addEventListener('DOMContentLoaded', checkGlobalCityData);
setInterval(checkGlobalCityData, 3000);
</script>
